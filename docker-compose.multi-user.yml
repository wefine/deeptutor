name: deeptutor-prod

# ============================================================
# DeepTutor v1.3.8 多用户生产环境
# 域名：deeptutor.home（统一入口，登录后各自隔离）
#
# 数据卷（Mac 共享盘，VM 通过 vmhgfs-fuse 挂载）：
#   /mnt/hgfs/docker-data-prod/deeptutor/
#     data/                    ← admin(wefine) 工作空间
#     multi-user/              ← 普通用户工作空间 + 系统数据
# ============================================================

services:

  deeptutor:
    image: 192.168.1.36:5000/deeptutor/app:1.3.8-arm64
    container_name: deeptutor
    restart: always
    env_file:
      - .env.prod
    environment:
      TZ: Asia/Shanghai
    volumes:
      # admin (wefine) 工作空间
      - /mnt/hgfs/docker-data-prod/deeptutor/data/user:/app/data/user
      - /mnt/hgfs/docker-data-prod/deeptutor/data/memory:/app/data/memory
      - /mnt/hgfs/docker-data-prod/deeptutor/data/knowledge_bases:/app/data/knowledge_bases
      # 多用户系统目录 + 普通用户工作空间
      - /mnt/hgfs/docker-data-prod/deeptutor/multi-user:/app/multi-user
    networks:
      - traefik-net
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-net"
      # Frontend (Next.js :3782)
      - "traefik.http.routers.dt-fe.rule=Host(`deeptutor.home`)"
      - "traefik.http.routers.dt-fe.entrypoints=websecure"
      - "traefik.http.routers.dt-fe.tls=true"
      - "traefik.http.routers.dt-fe.priority=1"
      - "traefik.http.routers.dt-fe.service=dt-fe-svc"
      - "traefik.http.services.dt-fe-svc.loadbalancer.server.port=3782"
      # Backend API (FastAPI :8001)
      - "traefik.http.routers.dt-be.rule=Host(`deeptutor.home`) && PathPrefix(`/api`)"
      - "traefik.http.routers.dt-be.entrypoints=websecure"
      - "traefik.http.routers.dt-be.tls=true"
      - "traefik.http.routers.dt-be.priority=10"
      - "traefik.http.routers.dt-be.service=dt-be-svc"
      - "traefik.http.services.dt-be-svc.loadbalancer.server.port=8001"

networks:
  traefik-net:
    external: true
    name: traefik-net
